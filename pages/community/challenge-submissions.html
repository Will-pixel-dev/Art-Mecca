<!-- pages/community/challenge-submissions.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge Submissions - Art Mecca</title>

    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/search.css" />
    <link rel="stylesheet" href="/css/avatar.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
      .submissions-main {
        padding: 2rem 0;
        min-height: 100vh;
        position: relative;
        z-index: 1;
      }

      .page-header {
        text-align: center;
        margin-bottom: 2.5rem;
      }

      .page-header h1 {
        font-size: 2.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #8a19e1, #d487f0, #f7d875);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .submissions-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
      }

      .submission-card {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 1rem;
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .submission-card:hover {
        transform: translateY(-4px);
        border-color: rgba(138, 25, 225, 0.2);
        box-shadow: 0 12px 48px rgba(138, 25, 225, 0.15);
      }

      .submission-image {
        width: 100%;
        height: 250px;
        object-fit: cover;
        background: rgba(0, 0, 0, 0.3);
      }

      .submission-info {
        padding: 1rem;
      }

      .submission-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 0.25rem;
      }

      .submission-artist {
        color: var(--text-secondary);
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .submission-artist .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8a19e1, #d487f0);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 0.7rem;
      }

      .submission-votes {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .vote-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.3rem 0.6rem;
        border-radius: 0.5rem;
      }

      .vote-btn:hover {
        background: rgba(138, 25, 225, 0.1);
        color: var(--text-primary);
      }

      .vote-btn.voted-up {
        color: #10b981;
      }

      .vote-btn.voted-down {
        color: #ef4444;
      }

      .vote-count {
        font-weight: 600;
        font-size: 1.1rem;
        color: var(--text-primary);
        min-width: 2rem;
        text-align: center;
      }

      .winner-badge {
        display: inline-block;
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
        padding: 0.2rem 0.8rem;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 600;
        margin-left: 0.5rem;
      }

      .status-badge {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 20px;
        font-size: 0.65rem;
        font-weight: 600;
      }

      .status-pending {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
      }
      .status-winner {
        background: rgba(16, 185, 129, 0.2);
        color: #10b981;
      }
      .status-runner-up {
        background: rgba(59, 130, 246, 0.2);
        color: #3b82f6;
      }

      .no-submissions {
        grid-column: 1/-1;
        text-align: center;
        padding: 4rem;
        color: var(--text-muted);
      }

      .no-submissions i {
        font-size: 3rem;
        display: block;
        margin-bottom: 1rem;
        opacity: 0.3;
      }

      .loading-spinner {
        grid-column: 1/-1;
        text-align: center;
        padding: 3rem;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(138, 25, 225, 0.15);
        border-top-color: #8a19e1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      body.light-mode .submission-card {
        background: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="main-header" id="main-header">
      <!-- ... Same header as other pages ... -->
    </header>

    <main class="submissions-main">
      <div class="container">
        <div class="page-header">
          <h1>
            <i class="fas fa-trophy"></i>
            <span id="challenge-title">Challenge</span> Submissions
          </h1>
          <p id="challenge-description">
            View all submissions and vote for your favorites
          </p>
        </div>

        <div class="submissions-grid" id="submissions-grid">
          <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Loading submissions...</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="tutorial-footer">
      <!-- ... Same footer ... -->
    </footer>

    <!-- Scripts -->
    <script src="/config/firebase-config.js"></script>
    <script src="js/auth/auth-manager.js"></script>
    <script src="js/auth/auth-check.js"></script>
    <script src="js/navbar-active.js"></script>
    <script src="js/community/challenge-voting.js"></script>
    <script src="js/main.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const challengeId = urlParams.get("id");

        if (!challengeId) {
          document.getElementById("submissions-grid").innerHTML = `
                    <div class="no-submissions">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>No challenge specified. Please go back and select a challenge.</p>
                    </div>
                `;
          return;
        }

        // Load challenge details
        try {
          const challengeDoc = await firebase
            .firestore()
            .collection("challenges")
            .doc(challengeId)
            .get();

          if (challengeDoc.exists) {
            const data = challengeDoc.data();
            document.getElementById("challenge-title").textContent =
              data.title || "Challenge";
            document.getElementById("challenge-description").textContent =
              data.description ||
              "View all submissions and vote for your favorites";
          }
        } catch (error) {
          console.error("Error loading challenge:", error);
        }

        // Load submissions
        const submissions =
          await window.challengeVoting.getChallengeSubmissions(challengeId);
        const grid = document.getElementById("submissions-grid");

        if (submissions.length === 0) {
          grid.innerHTML = `
                    <div class="no-submissions">
                        <i class="fas fa-image"></i>
                        <p>No submissions yet for this challenge.</p>
                        <p style="font-size: 0.85rem;">Be the first to submit your artwork!</p>
                        <a href="pages/community/upload.html?challenge=${challengeId}" class="btn-primary" style="display: inline-block; padding: 0.7rem 2rem; margin-top: 1rem; border-radius: 50px; text-decoration: none; background: linear-gradient(135deg, #8a19e1, #b06af0); color: white;">
                            <i class="fas fa-upload"></i> Submit Artwork
                        </a>
                    </div>
                `;
          return;
        }

        grid.innerHTML = submissions
          .map(
            (sub) => `
                <div class="submission-card" data-id="${sub.id}">
                    <img src="${sub.imageUrl || "/images/placeholder.jpg"}" alt="${sub.title || "Artwork"}" class="submission-image" loading="lazy">
                    <div class="submission-info">
                        <div class="submission-title">
                            ${sub.title || "Untitled"}
                            ${sub.status === "winner" ? '<span class="winner-badge">🏆 Winner</span>' : ""}
                            ${sub.status === "runner-up" ? '<span class="winner-badge" style="background: linear-gradient(135deg, #3b82f6, #2563eb);">🥈 Runner-up</span>' : ""}
                        </div>
                        <div class="submission-artist">
                            <span class="avatar">${(sub.userName || "A").charAt(0).toUpperCase()}</span>
                            ${sub.userName || "Anonymous Artist"}
                            <span class="status-badge status-${sub.status || "pending"}">${sub.status || "Pending"}</span>
                        </div>
                        <div class="submission-votes">
                            <button class="vote-btn vote-up" data-id="${sub.id}" data-type="up">
                                <i class="fas fa-chevron-up"></i>
                            </button>
                            <span class="vote-count">${sub.votes || 0}</span>
                            <button class="vote-btn vote-down" data-id="${sub.id}" data-type="down">
                                <i class="fas fa-chevron-down"></i>
                            </button>
                            <a href="pages/community/artwork-detail.html?id=${sub.artworkId}" style="margin-left: auto; color: var(--text-muted); font-size: 0.8rem;">
                                <i class="fas fa-external-link-alt"></i> View
                            </a>
                        </div>
                    </div>
                </div>
            `,
          )
          .join("");

        // Add vote event listeners
        document.querySelectorAll(".vote-btn").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const submissionId = btn.dataset.id;
            const voteType = btn.dataset.type;

            const result = await window.challengeVoting.vote(
              submissionId,
              voteType,
            );
            if (result.success) {
              // Refresh submissions
              const updated =
                await window.challengeVoting.getChallengeSubmissions(
                  challengeId,
                );
              // Update vote counts
              updated.forEach((sub) => {
                const card = grid.querySelector(`[data-id="${sub.id}"]`);
                if (card) {
                  const count = card.querySelector(".vote-count");
                  if (count) count.textContent = sub.votes || 0;
                }
              });
              // Update button states
              document.querySelectorAll(".vote-btn").forEach((b) => {
                b.classList.remove("voted-up", "voted-down");
              });
              // Highlight user's votes
              for (const sub of updated) {
                const vote = await window.challengeVoting.getUserVote(sub.id);
                if (vote) {
                  const card = grid.querySelector(`[data-id="${sub.id}"]`);
                  if (card) {
                    const btn = card.querySelector(`.vote-${vote}`);
                    if (btn) btn.classList.add(`voted-${vote}`);
                  }
                }
              }
            } else {
              alert(result.error || "Error voting. Please try again.");
            }
          });
        });

        // Highlight existing votes
        for (const sub of submissions) {
          const vote = await window.challengeVoting.getUserVote(sub.id);
          if (vote) {
            const card = grid.querySelector(`[data-id="${sub.id}"]`);
            if (card) {
              const btn = card.querySelector(`.vote-${vote}`);
              if (btn) btn.classList.add(`voted-${vote}`);
            }
          }
        }
      });
    </script>
  </body>
</html>
